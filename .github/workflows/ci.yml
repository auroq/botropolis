name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # pkg/render imports Ebitengine, so vet and the unit tests need the X11,
      # GL and ALSA headers to compile it at all. release.yml has always
      # installed these and ci.yml never did.
      - name: Build dependencies for Ebitengine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
      - run: make test lint

  # Everything the release publishes is built here, once, on a commit that has
  # already passed the gate. The release workflow downloads this artifact rather
  # than building again, so what ships is what was tested.
  package:
    needs: test-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build dependencies for Ebitengine
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
      - name: Package
        run: make tarball package checksums
      # The three packages come from one nfpm config, so they should agree by
      # construction. rpm is not installed on an Arch developer machine, so this
      # is the only place all three can actually be compared.
      - name: Install rpm so all three packages can be read
        run: sudo apt-get install -y rpm
      - name: The three packages must carry the same files
        run: make packages-check
      - name: Show what was built
        run: |
          ls -l dist/
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: botropolis-packages
          path: dist/*
          retention-days: 90
          if-no-files-found: error
