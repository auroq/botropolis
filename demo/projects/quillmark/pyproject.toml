[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quillmark"
version = "0.4.2"
description = "A very small static-site generator: Markdown in, HTML out, nothing else."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
quillmark = "quillmark.cli:main"

[tool.setuptools]
packages = ["quillmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
